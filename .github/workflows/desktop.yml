name: Desktop checks and installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux --x64
          - os: windows-latest
            targets: --win --x64
          - os: macos-latest
            targets: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3 libasound2t64
      - name: Linux desktop smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
        env:
          SIMPLY_LOGS_NO_SANDBOX: '1'
      - name: Windows and macOS desktop smoke test
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Create unsigned installers
        run: npm run dist -- ${{ matrix.targets }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Simply-Logs-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
